<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="527" cy="370" r="94" fill="#f57c00" opacity="0.14"/>
    <circle cx="773" cy="-96" r="91" fill="#f57c00" opacity="0.08"/>
    <circle cx="842" cy="196" r="92" fill="#f57c00" opacity="0.16"/>
    <circle cx="480" cy="614" r="93" fill="#f57c00" opacity="0.12"/>
    <circle cx="605" cy="-41" r="44" fill="#f57c00" opacity="0.10"/>
    <circle cx="58" cy="220" r="52" fill="#f57c00" opacity="0.14"/>
    <rect x="1299" y="312" width="32" height="20" rx="8" fill="#e65100" opacity="0.05" transform="rotate(22, 83, 108)"/>
    <rect x="703" y="119" width="62" height="56" rx="8" fill="#e65100" opacity="0.13" transform="rotate(41, 1135, 205)"/>
    <rect x="1233" y="486" width="82" height="81" rx="8" fill="#e65100" opacity="0.10" transform="rotate(32, 450, 285)"/>
    <rect x="-24" y="392" width="51" height="62" rx="8" fill="#e65100" opacity="0.13" transform="rotate(23, 1231, 274)"/>
    <rect x="419" y="123" width="25" height="37" rx="8" fill="#e65100" opacity="0.09" transform="rotate(16, 355, 109)"/>
    <rect x="837" y="590" width="36" height="40" rx="8" fill="#e65100" opacity="0.06" transform="rotate(44, 678, 197)"/>
    <rect x="638" y="17" width="36" height="75" rx="8" fill="#e65100" opacity="0.07" transform="rotate(27, 645, -55)"/>
    <rect x="1055" y="707" width="84" height="62" rx="8" fill="#e65100" opacity="0.11" transform="rotate(7, -76, 625)"/>
    <polygon points="680,-78 708,-22 652,-22" fill="#f57c00" opacity="0.03"/>
    <polygon points="314,121 386,265 242,265" fill="#f57c00" opacity="0.13"/>
    <polygon points="4,165 79,315 -71,315" fill="#f57c00" opacity="0.09"/>
    <polygon points="1156,196 1187,258 1125,258" fill="#f57c00" opacity="0.09"/>

  <!-- Wave at bottom -->
  <path d="M0,578 C360,604 840,552 1200,578 L1200,630 L0,630Z" fill="#f57c00" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    백링크 대행 사이트
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 주식투자
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#ffcc80" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#ffcc80" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 백링크 대행 사이트 — 주식투자
  </text>
</svg>